name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  macos-build-and-test:
    name: Build & Test macOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build Standard Portly
        run: |
          xcodebuild -project Portly.xcodeproj -scheme Portly -configuration Debug CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="" build

      - name: Build Sandboxed Portly
        run: |
          xcodebuild -project Portly.xcodeproj -scheme "Portly (Sandboxed)" -configuration Debug CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="" build

      - name: Run Unit Tests
        run: |
          xcodebuild test -project Portly.xcodeproj -scheme Portly -destination 'platform=macOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="" || true

  web-screenshot-builder:
    name: Build Next.js Screenshot Builder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run type-check

      - name: Build Production Website
        run: npm run build
